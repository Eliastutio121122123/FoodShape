services:
  foodshare-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm start -- --host 0.0.0.0 --port 8100 --poll 1000

volumes:
  node_modules:
