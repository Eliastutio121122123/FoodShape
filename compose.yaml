services:
  foodshare-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - .:/app
      # Use a fresh dependency volume so Docker does not keep an older
      # node_modules tree after dependencies are added to package-lock.json.
      - node_modules_foodshare_v2:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # These values come from FoodShape/.env (copy .env.example first).
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    command: sh -c "node scripts/write-runtime-config.mjs && npm start -- --host 0.0.0.0 --port 8100 --poll 1000"

volumes:
  node_modules_foodshare_v2:
